<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threshold explorer</title>
<style>
  /* An interactive figure follows the report's theme: the page posts {vividTheme: "light"|"dark"}. */
  :root { --bg:#FDFDFB; --ink:#2F3E50; --muted:#5C6270; --line:#A3A6B0; --curve:#4E79A7; --dot:#8B5CF6; --wash:rgba(139,92,246,.08); }
  :root[data-theme="dark"] { --bg:#15151A; --ink:#E6E8EF; --muted:#A3A6B5; --line:#6C6F7D; --curve:#7FA6D3; --dot:#A78BFA; --wash:rgba(139,92,246,.14); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter, system-ui, -apple-system, sans-serif; font-size:14px; padding:16px 18px; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  label { font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); min-width:92px; }
  input[type=range] { flex:1; min-width:180px; accent-color:var(--dot); }
  output { font-variant-numeric:tabular-nums; min-width:52px; text-align:right; }
  .phrase { margin:12px 0 4px; padding:12px 14px; border-radius:8px; background:var(--wash); font-size:17px; }
  .phrase b { color:var(--dot); font-weight:600; }
  svg { width:100%; height:auto; display:block; margin-top:8px; }
  .note { color:var(--muted); font-size:12px; margin-top:6px; }
</style>
</head>
<body>
  <div class="row"><label for="z">z-score</label><input id="z" type="range" min="-3" max="3" step="0.01" value="0.74"><output id="zv"></output></div>
  <div class="row"><label for="t">Inner cut</label><input id="t" type="range" min="0.1" max="0.9" step="0.05" value="0.5"><output id="tv"></output></div>
  <div class="phrase" id="phrase"></div>
  <svg id="plot" viewBox="0 0 600 180" role="img" aria-label="Standard normal density with the thresholds of the normative model"></svg>
  <p class="note">The thresholds are ±inner cut, ±1 and ±2. Move the inner cut to see how a choice in the normative model changes the words for the same number.</p>
<script>
  window.addEventListener("message", function (e) {
    if (e.data && (e.data.vividTheme === "light" || e.data.vividTheme === "dark")) document.documentElement.setAttribute("data-theme", e.data.vividTheme);
  });
  var PHRASES = ["far below average", "below average", "slightly below average", "average", "slightly above average", "above average", "far above average"];
  var z = document.getElementById("z"), t = document.getElementById("t");
  function words(zz, inner) {
    var cuts = [-2, -1, -inner, inner, 1, 2], i = 0;
    while (i < cuts.length && zz >= cuts[i]) i++;
    return PHRASES[i];
  }
  function sx(v) { return 30 + (v + 3) / 6 * 540; }
  function sy(d) { return 160 - d / 0.42 * 140; }
  function dens(v) { return Math.exp(-v * v / 2) / Math.sqrt(2 * Math.PI); }
  function draw() {
    var zz = +z.value, inner = +t.value;
    document.getElementById("zv").textContent = (zz >= 0 ? "+" : "") + zz.toFixed(2);
    document.getElementById("tv").textContent = "±" + inner.toFixed(2);
    document.getElementById("phrase").innerHTML = "A value of z = " + zz.toFixed(2) + " is <b>" + words(zz, inner) + "</b>.";
    var s = getComputedStyle(document.documentElement), path = "";
    for (var v = -3; v <= 3.0001; v += 0.05) path += (path ? "L" : "M") + sx(v).toFixed(1) + "," + sy(dens(v)).toFixed(1);
    var cuts = [-2, -1, -inner, inner, 1, 2].map(function (c) {
      return '<line x1="' + sx(c) + '" x2="' + sx(c) + '" y1="18" y2="160" stroke="var(--line)" stroke-width="1"/>';
    }).join("");
    var ticks = [-3, -2, -1, 0, 1, 2, 3].map(function (v) {
      return '<text x="' + sx(v) + '" y="176" text-anchor="middle" font-size="11" fill="var(--muted)">' + (v < 0 ? "−" + (-v) : v) + "</text>";
    }).join("");
    document.getElementById("plot").innerHTML = cuts +
      '<line x1="30" x2="570" y1="160" y2="160" stroke="var(--ink)" stroke-width="1"/>' +
      '<path d="' + path + '" fill="none" stroke="var(--curve)" stroke-width="2"/>' +
      '<circle cx="' + sx(zz) + '" cy="' + sy(dens(zz)) + '" r="6" fill="var(--dot)"/>' + ticks;
  }
  z.addEventListener("input", draw); t.addEventListener("input", draw); draw();
</script>
</body>
</html>
