suite: receptionist/access-denied
threshold: 0.95
analyst: receptionist
permissions: ["read:chat", "analyst:scout"]

cases:
  - id: comparison-without-permission
    query: "How does Haaland compare to Mbappé?"
    expect: {no_tool: true}

  - id: transfer-without-permission
    query: "How would Alexander Isak perform in La Liga?"
    expect: {no_tool: true}

  - id: scout-still-works
    query: "Alexander Isak"
    expect: {tool: redirect_to_scout}
