<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B5CF6"/></marker></defs><rect width="100%" height="100%" fill="#FDFDFB"/><rect x="14" y="12" width="300" height="118" rx="10" fill="#FFFFFF" stroke="#9A9DAA" stroke-width="1.4"/><text x="32" y="52.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#2F3E50" text-anchor="start" dominant-baseline="central">Tell it who it is</text><text x="32" y="84.0" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#5C6270" text-anchor="start" dominant-baseline="central">system message</text><line x1="322" y1="71" x2="368" y2="71" stroke="#8B5CF6" stroke-width="2" marker-end="url(#head)"/><rect x="384" y="12" width="562" height="118" rx="8" fill="#F4F3F8" stroke="#9A9DAA" stroke-width="1"/><text x="398" y="34.0" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12" fill="#2F3E50" xml:space="preserve">You are the Twelve Earpiece Scout</text><text x="398" y="51.0" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12" fill="#2F3E50" xml:space="preserve">analyst. Your job is going to be</text><text x="398" y="68.1" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12" fill="#2F3E50" xml:space="preserve">to give a concise, 4 sentence</text><text x="398" y="85.1" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12" fill="#2F3E50" xml:space="preserve">summary of a midfielder&#x27;s</text><text x="398" y="102.2" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12" fill="#2F3E50" xml:space="preserve">transfer potential.</text><rect x="14" y="148" width="300" height="118" rx="10" fill="#FFFFFF" stroke="#9A9DAA" stroke-width="1.4"/><text x="32" y="188.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#2F3E50" text-anchor="start" dominant-baseline="central">Tell it what it knows</text><text x="32" y="220.0" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#5C6270" text-anchor="start" dominant-baseline="central">29 question-answer pairs</text><line x1="322" y1="207" x2="368" y2="207" stroke="#8B5CF6" stroke-width="2" marker-end="url(#head)"/><rect x="384" y="148" width="562" height="118" rx="8" fill="#F4F3F8" stroke="#9A9DAA" stroke-width="1"/><text x="398" y="170.0" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12" fill="#2F3E50" xml:space="preserve">user: What are the metric which</text><text x="398" y="187.0" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12" fill="#2F3E50" xml:space="preserve">  measure if a midfielder has</text><text x="398" y="204.1" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12" fill="#2F3E50" xml:space="preserve">  box threat?</text><text x="398" y="221.1" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12" fill="#2F3E50" xml:space="preserve">assistant: The key to a midfielder</text><text x="398" y="238.2" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12" fill="#2F3E50" xml:space="preserve">  having high box threat is ...</text><rect x="14" y="284" width="300" height="118" rx="10" fill="#FFFFFF" stroke="#9A9DAA" stroke-width="1.4"/><text x="32" y="324.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#2F3E50" text-anchor="start" dominant-baseline="central">Tell it how to answer</text><text x="32" y="356.0" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#5C6270" text-anchor="start" dominant-baseline="central">system message, then 16 pairs</text><line x1="322" y1="343" x2="368" y2="343" stroke="#8B5CF6" stroke-width="2" marker-end="url(#head)"/><rect x="384" y="284" width="562" height="118" rx="8" fill="#F4F3F8" stroke="#9A9DAA" stroke-width="1"/><text x="398" y="306.0" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12" fill="#2F3E50" xml:space="preserve">user: &lt;synthetic text for</text><text x="398" y="323.0" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12" fill="#2F3E50" xml:space="preserve">  another player&gt;</text><text x="398" y="340.1" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12" fill="#2F3E50" xml:space="preserve">assistant: Moving to the</text><text x="398" y="357.1" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12" fill="#2F3E50" xml:space="preserve">  Premiership from the 1. HNL,</text><text x="398" y="374.2" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12" fill="#2F3E50" xml:space="preserve">  21-year-old Baturina ...</text><rect x="14" y="420" width="300" height="118" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/><text x="32" y="460.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#2F3E50" text-anchor="start" dominant-baseline="central">Tell it what data to use</text><text x="32" y="492.0" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#5C6270" text-anchor="start" dominant-baseline="central">the final user message</text><line x1="322" y1="479" x2="368" y2="479" stroke="#8B5CF6" stroke-width="2" marker-end="url(#head)"/><rect x="384" y="420" width="562" height="118" rx="8" fill="#F4F3F8" stroke="#9A9DAA" stroke-width="1"/><text x="398" y="442.0" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12" fill="#8B5CF6" xml:space="preserve">Vilma Koivisto is a unknown footed</text><text x="398" y="459.0" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12" fill="#8B5CF6" xml:space="preserve">23-year-old midfielder ... playing</text><text x="398" y="476.1" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12" fill="#8B5CF6" xml:space="preserve">for Hammarby in the Damallsvenskan.</text><text x="398" y="493.1" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12" fill="#8B5CF6" xml:space="preserve">Let&#x27;s consider a move from the</text><text x="398" y="510.2" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="12" fill="#8B5CF6" xml:space="preserve">Swedish Damallsvenskan to the ...</text></svg>
