<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 140" width="960" height="140"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B5CF6"/></marker></defs><rect width="100%" height="100%" fill="#FDFDFB"/><rect x="10" y="15" width="190" height="110" rx="10" fill="#FFFFFF" stroke="#9A9DAA" stroke-width="1.4"/><text x="105.0" y="59.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#2F3E50" text-anchor="middle" dominant-baseline="central">The model gives</text><text x="105.0" y="80.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#2F3E50" text-anchor="middle" dominant-baseline="central">the name as text</text><rect x="260" y="15" width="190" height="110" rx="10" fill="#FFFFFF" stroke="#9A9DAA" stroke-width="1.4"/><text x="355.0" y="49.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#2F3E50" text-anchor="middle" dominant-baseline="central">Full-text search:</text><text x="355.0" y="70.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#2F3E50" text-anchor="middle" dominant-baseline="central">up to 20</text><text x="355.0" y="90.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#2F3E50" text-anchor="middle" dominant-baseline="central">candidates</text><rect x="510" y="15" width="190" height="110" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/><text x="605.0" y="59.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#2F3E50" text-anchor="middle" dominant-baseline="central">The model picks one,</text><text x="605.0" y="80.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#2F3E50" text-anchor="middle" dominant-baseline="central">or none if unsure</text><rect x="760" y="15" width="190" height="110" rx="10" fill="#FFFFFF" stroke="#9A9DAA" stroke-width="1.4"/><text x="855.0" y="59.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#2F3E50" text-anchor="middle" dominant-baseline="central">Context set, or</text><text x="855.0" y="80.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#2F3E50" text-anchor="middle" dominant-baseline="central">the user is asked</text><line x1="206" y1="70" x2="254" y2="70" stroke="#8B5CF6" stroke-width="2" marker-end="url(#head)"/><line x1="456" y1="70" x2="504" y2="70" stroke="#8B5CF6" stroke-width="2" marker-end="url(#head)"/><line x1="706" y1="70" x2="754" y2="70" stroke="#8B5CF6" stroke-width="2" marker-end="url(#head)"/></svg>
